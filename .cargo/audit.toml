# Cargo Audit Configuration
# https://github.com/rustsec/rustsec/blob/main/cargo-audit/audit.toml.example

[advisories]
# Ignore informational 'unmaintained' notices for mature, stable libraries without vulnerabilities
ignore = [
    "RUSTSEC-2025-0141", # bincode 1.3.3: unmaintained notice (standard binary format, no CVE)
    "RUSTSEC-2024-0436", # paste 1.0.15: unmaintained notice (macro transitive dep of simba/nalgebra/rapier3d)
    "RUSTSEC-2026-0192", # ttf-parser 0.25.1: unmaintained notice (transitive dep of winit Linux font loader)
]
