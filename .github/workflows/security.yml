name: Security Audit & Supply Chain Verification

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-audit:
    name: RustSec Advisory Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run Cargo Audit (Vulnerabilities, CVEs & Insecure Transitives)
        run: cargo audit --deny warnings
