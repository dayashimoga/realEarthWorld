name: Performance Benchmarks & Baselines

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  benchmarks:
    name: Criterion & Throughput Regression Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "bench-cache"

      - name: Run CLI Geospatial & Compiler Throughput Benchmarks
        run: cargo run --release -p realearth-cli -- bench

      - name: Run Criterion Benchmark Suite
        run: cargo bench -p realearth-benchmarks -- --test

      - name: Upload Criterion Benchmark Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: criterion-benchmark-results
          path: target/criterion/
          if-no-files-found: warn
