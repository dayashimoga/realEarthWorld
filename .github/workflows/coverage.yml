name: Code Coverage Certification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    name: LLVM Code Coverage (>=90% Core Engine Target)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "coverage-cache"

      - name: Generate Code Coverage (LCOV & HTML)
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          cargo llvm-cov --workspace --html --output-dir target/llvm-cov/html

      - name: Check Core Engine Coverage Threshold (>=90%)
        run: |
          echo "Verifying coverage threshold for core architectural crates..."
          cargo llvm-cov --package realearth-shared --package realearth-geospatial --package realearth-validation --package realearth-compiler --summary-only

      - name: Upload LCOV Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: lcov-coverage-report
          path: lcov.info
          if-no-files-found: error

      - name: Upload HTML Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage-report
          path: target/llvm-cov/html/
          if-no-files-found: error
