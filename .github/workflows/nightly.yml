name: Nightly Deep Verification & Baselines

on:
  schedule:
    - cron: '0 2 * * *' # Every night at 02:00 UTC
  workflow_dispatch:

jobs:
  nightly-deep-validation:
    name: Deep GIS, Fuzzing, Soak & Performance Baselines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust & Cache
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          cache-key: nightly

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run Nightly Security & Dependency Vulnerability Audit
        run: cargo audit --deny warnings

      - name: Deep GIS Validation Across All 38 US Cities
        run: cargo test --test us_city_catalog_validation --verbose

      - name: Adversarial Fuzzing & Boundary Condition Invariants
        run: cargo test --test adversarial_validation --verbose

      - name: Long-Running Soak Traversal (Zero Memory Leak Verification)
        run: cargo test --test streaming_performance -- test_soak_traversal_zero_memory_leak --verbose

      - name: 10 Million Scale Managed Geographic Objects Simulation
        run: cargo test --test planetary_infrastructure -- test_stage11_3_ten_million_managed_objects_scaling_demonstration --verbose

      - name: Planetary Infrastructure Geodesics & Boundary Invariants
        run: cargo test --test planetary_infrastructure --verbose

      - name: Vehicle Physics, Aerodynamics & Multimodal Invariants
        run: cargo test --test vehicle_simulation --verbose

      - name: Stage 7 Multimodal Transportation Simulation Certification
        run: cargo test --test stage7_multimodal_transport_certification --verbose

      - name: Stage 8 Regional Catalog & Interstate Corridors Certification
        run: cargo test --test stage8_regional_catalog_and_corridors_certification --verbose

      - name: Stage 9 Authoritative Multiplayer Networking Certification
        run: cargo test --test stage9_authoritative_multiplayer_certification --verbose

      - name: Stage 10 Five-Platform Application Parity Certification
        run: cargo test --test five_platform_application_parity --verbose

      - name: Stage 11 Final Production Lifecycle Certification
        run: cargo test --test final_production_certification --verbose

      - name: Recovery Stage B Authoritative Physics & Inputs Certification
        run: cargo test --test stage_b_authoritative_physics_and_inputs --verbose

      - name: Recovery Stage B Remediation Certification
        run: cargo test --test stage_b_remediation_certification --verbose

      - name: Recovery Stage C Premium Models & Animation Certification
        run: cargo test --test stage_c_premium_models_and_animation --verbose

      - name: Recovery Stage D Real GIS Streaming & City Transitions Certification
        run: cargo test --test stage_d_gis_streaming_and_city_transitions --verbose

      - name: Recovery Stage E Multimodal Gameplay & UX Certification
        run: cargo test --test stage_e_multimodal_gameplay_and_ux --verbose

      - name: Recovery Stage F Production Performance & Five-Platform Certification
        run: cargo test --test stage_f_production_performance_and_five_platform_certification --verbose

      - name: Criterion Performance Benchmark Baselines
        run: cargo bench -p realearth-benchmarks -- --test

      - name: CLI Throughput & Geospatial Benchmarks
        run: cargo run --release -p realearth-cli -- bench

      - name: Upload Concise Benchmark Baselines & Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-benchmark-baselines
          path: |
            target/criterion/
            target/performance_certification_report.json
          if-no-files-found: ignore
          retention-days: 30
