name: Production Release & Gated Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-windows:
    name: Package Windows (x86_64 EXE & ZIP)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust & Cache
        uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-pc-windows-msvc
          cache-key: release-windows

      - name: Build Windows Release Binaries
        run: cargo build --workspace --release

      - name: Package Windows Portable Release
        shell: pwsh
        run: ./scripts/package_windows.ps1

      - name: Upload Flattened Windows Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: dist/windows/
          if-no-files-found: error
          retention-days: 7

  package-linux:
    name: Package Linux (x86_64 AppImage & Tarball)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust & Cache
        uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-unknown-linux-gnu
          cache-key: release-linux

      - name: Build Linux Release Binaries
        run: cargo build --workspace --release

      - name: Package Linux AppImage & Tarball
        run: |
          chmod +x scripts/package_linux.sh
          ./scripts/package_linux.sh

      - name: Upload Flattened Linux Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: dist/linux/
          if-no-files-found: error
          retention-days: 7

  package-macos:
    name: Package macOS (Universal APP, DMG & Tarball)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust & Cache
        uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          cache-key: release-macos

      - name: Build macOS Universal Binaries
        run: cargo build --workspace --release

      - name: Package macOS App Bundle & DMG
        run: |
          chmod +x scripts/package_macos.sh
          ./scripts/package_macos.sh

      - name: Upload Flattened macOS Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-universal
          path: dist/macos/
          if-no-files-found: error
          retention-days: 7

  package-mobile:
    name: Package Mobile (Android APK/AAB & iOS IPA/App)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust with Mobile Targets & Cache
        uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-linux-android,aarch64-apple-ios
          cache-key: release-mobile

      - name: Setup Java & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Configure Android NDK Environment
        run: |
          NDK_LLVM_BIN=$(echo $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/*/bin)
          echo "NDK_LLVM_BIN=$NDK_LLVM_BIN" >> $GITHUB_ENV
          echo "$NDK_LLVM_BIN" >> $GITHUB_PATH
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_LLVM_BIN/aarch64-linux-android31-clang" >> $GITHUB_ENV
          echo "CC_aarch64_linux_android=$NDK_LLVM_BIN/aarch64-linux-android31-clang" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$NDK_LLVM_BIN/llvm-ar" >> $GITHUB_ENV

      - name: Build Android JNI Shared Library
        run: cargo ndk --target aarch64-linux-android --platform 31 build -p realearth-mobile --release

      - name: Build iOS Framework Static Library
        run: cargo build -p realearth-mobile --target aarch64-apple-ios --release

      - name: Package Android Applications
        run: |
          chmod +x scripts/package_android.sh
          ./scripts/package_android.sh

      - name: Package iOS Applications
        run: |
          chmod +x scripts/package_ios.sh
          ./scripts/package_ios.sh

      - name: Upload Android Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/android/
          if-no-files-found: error
          retention-days: 7

      - name: Upload iOS Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: dist/ios/
          if-no-files-found: error
          retention-days: 7

  package-regions:
    name: Package Real Geographic Regions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Package Standalone Geographic Regions
        run: |
          chmod +x scripts/package_regions.sh
          ./scripts/package_regions.sh dist/regions

      - name: Upload Standalone Region Packages
        uses: actions/upload-artifact@v4
        with:
          name: release-regions
          path: dist/regions/
          if-no-files-found: error
          retention-days: 7

  verify-and-publish:
    name: Verify Release Integrity, Gates & Publish Direct Assets
    needs: [package-windows, package-linux, package-macos, package-mobile, package-regions]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust & Cache
        uses: ./.github/actions/setup-rust
        with:
          cache-key: release-verify

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows-x64
          path: dist/windows/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux-x64
          path: dist/linux/

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-macos-universal
          path: dist/macos/

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-android
          path: dist/android/

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-ios
          path: dist/ios/

      - name: Download Standalone Region Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-regions
          path: dist/regions/

      - name: Execute Strict Release Integrity Audit
        run: |
          chmod +x scripts/verify_release_integrity.sh
          ./scripts/verify_release_integrity.sh dist dist/release_manifest.json

      - name: Execute CLI Compile Smoke Test
        run: cargo run -p realearth-cli -- compile --output target/release_world_test

      - name: Execute Viewer Headless Startup Smoke Test
        run: cargo run -p realearth-viewer -- --headless --benchmark --frames 10 --region sf

      - name: Upload Certified Release Manifest & Checksums
        uses: actions/upload-artifact@v4
        with:
          name: certified-release-manifest
          path: |
            dist/release_manifest.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (Tagged Release Only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows/realearth-windows-x64.zip
            dist/windows/realearth-windows-x64.zip.sha256
            dist/linux/realearth-linux-x64.tar.gz
            dist/linux/realearth-linux-x64.tar.gz.sha256
            dist/macos/realearth-macos-universal.tar.gz
            dist/macos/realearth-macos-universal.tar.gz.sha256
            dist/ios/realearth-ios-simulator.zip
            dist/ios/realearth-ios-simulator.zip.sha256
            dist/regions/realearth-region-san-francisco.zip
            dist/regions/realearth-region-san-francisco.zip.sha256
            dist/regions/realearth-region-san-francisco.tar.gz
            dist/regions/realearth-region-san-francisco.tar.gz.sha256
            dist/release_manifest.json
            dist/SHA256SUMS
            LICENSE
            docs/UserGuide.md
            docs/SetupAndConfiguration.md
          generate_release_notes: true
