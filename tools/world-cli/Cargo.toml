[package]
name = "realearth-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "realearth-cli"
path = "src/main.rs"

[dependencies]
realearth-shared = { path = "../../engine/shared" }
realearth-geospatial = { path = "../../engine/geospatial" }
realearth-ingestion = { path = "../../engine/ingestion" }
realearth-validation = { path = "../../engine/validation" }
realearth-compiler = { path = "../../engine/compiler" }
realearth-streaming = { path = "../../engine/streaming" }
realearth-gameplay = { path = "../../engine/gameplay" }
realearth-networking = { path = "../../engine/networking" }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tempfile = "3.17"
