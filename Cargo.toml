[workspace]
resolver = "2"
members = [
    "engine/shared",
    "engine/geospatial",
    "engine/ingestion",
    "engine/validation",
    "engine/compiler",
    "engine/streaming",
    "engine/simulation",
    "engine/navigation",
    "engine/vehicles",
    "engine/rendering",
    "engine/gameplay",
    "tools/world-cli",
    "apps/world-viewer",
    "benchmarks",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Real Earth Engineering Team"]
license = "Apache-2.0"
repository = "https://github.com/realearth/realearth"

[workspace.dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.43", features = ["full"] }
rayon = "1.10"
zstd = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
bincode = "1.3"
geo = "0.28"
earcutr = "0.4"
petgraph = "0.6"
bytemuck = { version = "1.21", features = ["derive"] }
bevy_ecs = "0.15"
rapier3d = "0.22"
wgpu = "23.0"
winit = { version = "0.30", features = ["rwh_06"] }
criterion = { version = "0.5", features = ["html_reports"] }
